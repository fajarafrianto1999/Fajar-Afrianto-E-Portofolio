<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilihan E-Portofolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }

        .cards-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 350px;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: all 0.6s ease;
        }

        .card:hover {
            transform: translateY(-15px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card:hover::before {
            left: 100%;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.1);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .card p {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .card-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .card:hover .card-btn {
            background: linear-gradient(to right, #2563eb, #7c3aed);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            transform: scale(1.05);
        }

        /* Decorative background elements */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: #3b82f6;
            border-radius: 50%;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: #8b5cf6;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            .cards-container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <h1>Selamat Datang</h1>
        <p class="subtitle">Silakan pilih portofolio yang ingin Anda lihat</p>

        <div class="cards-container">
            <!-- Portofolio 1 -->
            <a href="E-Portofolio 1/index.html" class="card">
                <div class="card-icon">💼</div>
                <h2>Portofolio 1</h2>
                <p>Jelajahi karya, pengalaman, dan pencapaian pada Portofolio pertama.</p>
                <div class="card-btn">Buka Porto 1</div>
            </a>

            <!-- Portofolio 2 -->
            <a href="E-Portofolio 2/index.html" class="card">
                <div class="card-icon">🚀</div>
                <h2>Portofolio 2</h2>
                <p>Lihat lebih banyak proyek dan karya desain pada Portofolio kedua.</p>
                <div class="card-btn">Buka Porto 2</div>
            </a>
        </div>
    </div>
</body>
</html>
